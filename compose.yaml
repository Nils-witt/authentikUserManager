services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: authentik_manager
      POSTGRES_PASSWORD: authentik_manager
      POSTGRES_DB: authentik_manager
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authentik_manager"]
      interval: 5s
      retries: 10

volumes:
  db-data:
